<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Client App - CMS Publisher</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  label { display: block; margin-top: 14px; font-weight: bold; }
  input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 18px; padding: 10px 18px; background: #222; color: #fff; border: none; cursor: pointer; }
  button:disabled { background: #999; cursor: not-allowed; }
  #status { margin-top: 16px; padding: 12px; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 13px; }
  .ok { background: #e6ffed; border: 1px solid #34c759; }
  .err { background: #ffecec; border: 1px solid #ff3b30; }
  .pending { background: #fff8e1; border: 1px solid #ffc107; }
</style>
</head>
<body>
  <h1>Client App (CMS)</h1>
  <p>This simulates the "Client App" box in the diagram. It POSTs to the Server Application's <code>/publish</code> endpoint.</p>

  <label>Server URL</label>
  <input id="serverUrl" value="http://localhost:4000" />

  <label>Page</label>
  <input id="page" value="Home" />

  <label>Title</label>
  <input id="title" value="Welcome" />

  <label>Description</label>
  <textarea id="description" rows="3">Updated Text</textarea>

  <button id="publishBtn" onclick="publish()">Publish</button>

  <div id="status" style="display:none;"></div>

<script>
async function publish() {
  const btn = document.getElementById('publishBtn');
  const statusEl = document.getElementById('status');
  const serverUrl = document.getElementById('serverUrl').value.replace(/\/$/, '');

  const payload = {
    page: document.getElementById('page').value,
    title: document.getElementById('title').value,
    description: document.getElementById('description').value
  };

  btn.disabled = true;
  statusEl.style.display = 'block';
  statusEl.className = 'pending';
  statusEl.textContent = 'Publishing... contacting server...';

  try {
    const res = await fetch(serverUrl + '/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (res.ok) {
      statusEl.className = 'ok';
      statusEl.textContent = 'SUCCESS\n\n' + JSON.stringify(data, null, 2);
    } else {
      statusEl.className = 'err';
      statusEl.textContent = 'FAILED (HTTP ' + res.status + ')\n\n' + JSON.stringify(data, null, 2);
    }
  } catch (err) {
    statusEl.className = 'err';
    statusEl.textContent = 'Could not reach server at ' + serverUrl + '\n\n' + err.message +
      '\n\nCheck: is the server running? Is the URL/port correct? Is CORS enabled on the server?';
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
